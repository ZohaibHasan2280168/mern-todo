---
- name: Deploy MERN Todo Stack to All Target VMs
  hosts: all
  become: yes
  tasks:

    - name: Create Docker network
      community.docker.docker_network:
        name: mern_network
        state: present

    # 1. Database Tier
    - name: Run MongoDB Container
      community.docker.docker_container:
        name: mongodb_container
        image: mongo:6.0
        state: started
        restart_policy: always
        networks:
          - name: mern_network
        ports:
          - "27017:27017"
        volumes:
          - mongo_data:/data/db

    # 2. Backend Tier
    - name: Build and Run Backend Container
      community.docker.docker_container:
        name: backend_container
        build:
          path: ./server
        image: mern-backend:latest
        state: started
        restart_policy: always
        networks:
          - name: mern_network
        ports:
          - "5005:5000"
        env:
          MONGODB_ATLAS_CONNECTION: "mongodb://mongodb_container:27017/todo"
          PORT: "5000"

    # 3. Nginx Config for Frontend
    - name: Create Nginx Config File
      copy:
        dest: "./client/default.conf"
        content: |
          server {
              listen 80;
              location / {
                  root /usr/share/nginx/html;
                  index index.html index.htm;
                  try_files $uri $uri/ /index.html;
              }
              location /api {
                  proxy_pass http://backend_container:5000;
                  proxy_http_version 1.1;
                  proxy_set_header Upgrade $http_upgrade;
                  proxy_set_header Connection "upgrade";
                  proxy_set_header Host $host;
                  proxy_set_header X-Real-IP $remote_addr;
                  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                  proxy_set_header X-Forwarded-Proto $scheme;
              }
          }

    # 4. Frontend Tier
    - name: Build and Run Frontend Container
      community.docker.docker_container:
        name: frontend_container
        build:
          path: ./client
        image: mern-frontend:latest
        state: started
        restart_policy: always
        networks:
          - name: mern_network
        ports:
          - "8082:80"
