---
- name: Deploy MERN Stack Application to Target VMs
  hosts: azure_vm
  become: yes
  tasks:

    # 1. Pull Source Code From GitHub
    - name: Clone or Pull latest code from GitHub
      ansible.builtin.git:
        repo: 'https://github.com/ZohaibHasan2280168/mern-todo.git'
        dest: /home/azureuser/app
        single_branch: yes
        version: main
        force: yes

    # 2. Docker Network Setup
    - name: Ensure Docker network exists
      community.docker.docker_network:
        name: mern_network
        state: present

    # 3. Database Tier (MongoDB)
    - name: Deploy MongoDB Container
      community.docker.docker_container:
        name: mongodb_container
        image: mongo:6.0
        state: started
        restart_policy: always
        networks:
          - name: mern_network
        ports:
          - "27017:27017"
        volumes:
          - mongo_data:/data/db

    # 4. Backend Tier (Build & Run)
    - name: Build Backend Image
      community.docker.docker_image:
        build:
          path: /home/azureuser/app/server
        name: mern-backend
        tag: latest
        source: build

    - name: Run Backend Container
      community.docker.docker_container:
        name: backend_container
        image: mern-backend:latest
        state: started
        restart_policy: always
        networks:
          - name: mern_network
        ports:
          - "5005:5000"
        env:
          MONGODB_ATLAS_CONNECTION: "mongodb://mongodb_container:27017/todo"
          PORT: "5000"

    # 5. Frontend Tier (Build & Run)
    - name: Build Frontend Image
      community.docker.docker_image:
        build:
          path: /home/azureuser/app/client
        name: mern-frontend
        tag: latest
        source: build

    - name: Run Frontend Container
      community.docker.docker_container:
        name: frontend_container
        image: mern-frontend:latest
        state: started
        restart_policy: always
        networks:
          - name: mern_network
        ports:
          - "8082:80"
